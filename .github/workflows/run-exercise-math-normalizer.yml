name: Run exercise math normalizer

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/run-exercise-math-normalizer.yml"

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Normalize exercise mathematics
        run: python scripts/normalize_exercise_math.py

      - name: Commit normalized exercise files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/exercises-*/problem-*/index.md
          if git diff --cached --quiet; then
            echo "No exercise files changed."
          else
            git commit -m "Normalize list-adjacent exercise mathematics"
            git push
          fi
