name: Diagnose latest deploy run

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/diagnose-latest-deploy.yml"

permissions:
  actions: read
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Collect latest deploy metadata and logs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p diagnostics
          set +e

          gh run list \
            --repo "$GH_REPOSITORY" \
            --workflow deploy-mkdocs.yml \
            --limit 1 \
            --json databaseId,number,headSha,displayTitle,status,conclusion,createdAt,updatedAt,url \
            > diagnostics/latest-deploy-list.json 2> diagnostics/latest-deploy-command-error.txt

          RUN_ID=$(python - <<'PY'
          import json
          from pathlib import Path

          path = Path("diagnostics/latest-deploy-list.json")
          try:
              runs = json.loads(path.read_text(encoding="utf-8"))
          except Exception:
              runs = []
          print(runs[0]["databaseId"] if runs else "")
          PY
          )

          if [ -z "$RUN_ID" ]; then
            printf '%s\n' "No deploy run could be resolved." > diagnostics/latest-deploy-log.txt
            printf '%s\n' '{}' > diagnostics/latest-deploy-metadata.json
          else
            gh run view "$RUN_ID" \
              --repo "$GH_REPOSITORY" \
              --json databaseId,number,attempt,headSha,displayTitle,status,conclusion,createdAt,updatedAt,url,jobs \
              > diagnostics/latest-deploy-metadata.json 2>> diagnostics/latest-deploy-command-error.txt

            gh run view "$RUN_ID" \
              --repo "$GH_REPOSITORY" \
              --log \
              > diagnostics/latest-deploy-log.txt 2>> diagnostics/latest-deploy-command-error.txt
          fi

          exit 0

      - name: Commit diagnostic files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/
          if git diff --cached --quiet; then
            echo "No diagnostic changes to commit."
          else
            git commit -m "Record latest deploy run"
            git push
          fi
